name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore PetAdoptionPlatform.sln

      - name: Build solution
        run: >
          dotnet build
          PetAdoptionPlatform.sln
          -c Release
          --no-restore

      - name: Run tests
        run: >
          dotnet test
          PetAdoptionPlatform.sln
          -c Release
          --no-build
          --verbosity normal

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: >
          docker build
          --tag pet-adoption-platform:ci
          .