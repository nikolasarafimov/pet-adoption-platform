name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore PetAdoptionPlatform.sln

      - name: Build solution
        run: dotnet build PetAdoptionPlatform.sln -c Release --no-restore

      - name: Run tests
        run: dotnet test PetAdoptionPlatform.sln -c Release --no-build --verbosity normal

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build --tag pet-adoption-platform:ci .